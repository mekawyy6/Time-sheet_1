  <!-- JS -->

  <script>
    function refreshFilledState(root) {
      const controls = root.querySelectorAll('input, select, textarea');

      controls.forEach((el) => {
        if (el.type === 'checkbox' || el.type === 'radio' || el.readOnly) return;

        const hasValue = (el.value || '').trim() !== '';
        el.classList.toggle('filled', hasValue);
      });

      root.querySelectorAll('.required-group').forEach((group) => {
        const checked = group.querySelectorAll('input[type="checkbox"]:checked').length > 0;
        group.classList.toggle('filled-group', checked);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.auto-fill-form').forEach((form) => {
        form.addEventListener('input', () => refreshFilledState(form));
        form.addEventListener('change', () => refreshFilledState(form));
        refreshFilledState(form);
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    });
  </script>

</body>
